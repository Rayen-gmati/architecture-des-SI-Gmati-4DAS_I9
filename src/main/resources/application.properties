spring.application.name=autoloc

# Connexion a la base MySQL
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Generation automatique du schema
spring.jpa.hibernate.ddl-auto=update

# Affichage des requetes SQL generees
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
